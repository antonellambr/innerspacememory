<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inner Space Memory</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav id="menu">
            <ul>
                <li id="nav-home"><img src="img/home.png" alt=""></li>
                <li id="level"></li>
                <li id="profile-btn"><img src="img/person.png" alt=""></li>
            </ul>
        </nav>
    </header>
    <main>
        <div id="home" data-view="view-home">
            <h1 class="press-start-2p-regular main-title">Inner Space Memory</h1>
            <section id="levels">
                <div class="level-card" data-level="easy">
                    <h2 class="press-start-2p-regular">Easy</h2>
                    <img src="img/easy_no_bg.png" alt="" srcset="">
                </div>

                <div class="level-card" data-level="medium">
                    <h2 class="press-start-2p-regular">Medium</h2>
                    <img src="img/medium_no_bg.png" alt="" srcset="">
                </div>

                <div class="level-card" data-level="hard">
                    <h2 class="press-start-2p-regular">Hard</h2>
                    <img src="img/hard_no_bg.png" alt="" srcset="">
                </div>
            </section>
        </div>

        <div id="game" class="hidden" data-view="view-game">
            <div id="timer" class="press-start-2p-regular"></div>
        </div>

        <div id="result-modal" class="hidden" data-view="view-result">
            <h2 id="result-title" class="press-start-2p-regular"></h2>
            <p id="result-message"></p>
            <div id="result-buttons">
                <button id="play-again-btn" class="press-start-2p-regular"><img src="img/update.png" alt=""> Play Again</button>
                <button id="home-btn" class="press-start-2p-regular"><img src="img/home.png" alt=""> Home</button>
            </div>
        </div>

        <div id="profile-modal" class="hidden" data-view="view-modal">
            <h2 class="press-start-2p-regular">Stats</h2>
            <p id="stat-total">Partite: 0</p>
            <p id="stat-wins">Vittorie: 0</p>
            <p id="stat-losts">Sconfitte: 0</p>
            <p id="stat-time">Tempo medio: 0s</p>
            <button id="close-profile" class="press-start-2p-regular">Chiudi</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
